services:
  - type: web
    name: campus-vote-api
    runtime: docker
    rootDir: backend
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: campus-vote-db
          property: connectionString
      - key: DB_USERNAME
        fromDatabase:
          name: campus-vote-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: campus-vote-db
          property: password
      - key: CORS_ORIGINS
        sync: false
databases:
  - name: campus-vote-db
    plan: free
